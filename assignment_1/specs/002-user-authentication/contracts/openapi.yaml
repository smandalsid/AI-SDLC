openapi: 3.1.0
info:
  title: Bus Booking API
  version: 2.0.0
  description: >-
    Contract for feature 002-user-authentication (supersedes the 001 contract). Every operation requires a bearer
    session credential except sign-in and the two health checks. The running app's generated OpenAPI must match
    this file.
servers:
  - url: http://localhost:8000/api/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Sign in with a username and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: asha
              password: example-only
      responses:
        '200':
          description: Signed in; a new session was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: >-
            Unknown username, wrong password, or another user's password (code invalid_credentials). The body,
            status and message are identical for all three cases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: >-
            Five failed sign-ins for this username within five minutes (code too_many_attempts). The message and the
            Retry-After header give the seconds to wait; the right password does not bypass the wait.
          headers:
            Retry-After:
              description: Seconds until sign-in is possible again
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/logout:
    post:
      summary: End the caller's current session
      operationId: logout
      responses:
        '204':
          description: Session ended; its credential is refused from now on
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/me:
    get:
      summary: The signed-in user (used by the UI to confirm that its session is valid)
      operationId: me
      responses:
        '200':
          description: The user of the current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /buses:
    get:
      summary: List buses (paginated)
      operationId: listBuses
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of buses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /buses/{bus_id}:
    get:
      summary: Get a bus with all seats and their status
      operationId: getBus
      parameters:
        - name: bus_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: Bus detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /bookings:
    post:
      summary: Book 1 to 6 seats on a bus for the signed-in user (all-or-nothing)
      operationId: createBookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
            example:
              bus_id: 1
              seat_numbers: [3, 4]
      responses:
        '201':
          description: Seats booked for the user of the session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResult'
        '400':
          description: Seat number is greater than the bus's seat count (code invalid_seat)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: At least one seat is already booked (code seat_unavailable); nothing was stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health:
    get:
      summary: Liveness
      operationId: health
      security: []
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /health/ready:
    get:
      summary: Readiness (database reachable)
      operationId: ready
      security: []
      responses:
        '200':
          description: Database answered a query
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Session credential returned by /auth/login. Missing, malformed, forged, altered, expired and signed-out
        credentials are all refused with the same 401 (code unauthenticated).
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthenticated:
      description: >-
        No valid session (code unauthenticated). The body never says whether the credential was missing, malformed,
        forged, expired or signed out.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request failed schema validation (code validation_error)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Bus not found (code bus_not_found)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Database unavailable (code service_unavailable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
                - validation_error
                - invalid_seat
                - bus_not_found
                - seat_unavailable
                - unauthenticated
                - invalid_credentials
                - too_many_attempts
                - service_unavailable
                - internal_error
                - not_found
                - method_not_allowed
            message:
              type: string
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    AuthUser:
      type: object
      required: [id, name]
      properties:
        id: {type: integer}
        name: {type: string}
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
          description: Signed session credential; send as "Authorization: Bearer <access_token>"
        token_type:
          type: string
          const: bearer
        expires_at:
          type: string
          format: date-time
          description: UTC; 30 minutes after sign-in, never extended
        user:
          $ref: '#/components/schemas/AuthUser'
    Bus:
      type: object
      required: [id, name, total_seats]
      properties:
        id: {type: integer}
        name: {type: string}
        total_seats: {type: integer, minimum: 1, maximum: 60}
    BusPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Bus'}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}
    Seat:
      type: object
      required: [seat_number, status]
      properties:
        seat_number: {type: integer, minimum: 1}
        status:
          type: string
          enum: [available, booked]
    BusDetail:
      type: object
      required: [id, name, total_seats, seats]
      properties:
        id: {type: integer}
        name: {type: string}
        total_seats: {type: integer}
        seats:
          type: array
          description: Exactly total_seats items ordered by seat_number (at most 60)
          items: {$ref: '#/components/schemas/Seat'}
    BookingCreate:
      type: object
      required: [bus_id, seat_numbers]
      additionalProperties: false
      description: The booking user is always the user of the session; a user_id field is rejected (422).
      properties:
        bus_id: {type: integer, minimum: 1, maximum: 2147483647}
        seat_numbers:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items: {type: integer, minimum: 1, maximum: 2147483647}
    Booking:
      type: object
      required: [id, bus_id, user_id, seat_number, booked_at]
      properties:
        id: {type: integer}
        bus_id: {type: integer}
        user_id: {type: integer}
        seat_number: {type: integer}
        booked_at:
          type: string
          format: date-time
          description: UTC, server assigned, identical for all seats in one request
    BookingResult:
      type: object
      required: [bookings]
      properties:
        bookings:
          type: array
          items: {$ref: '#/components/schemas/Booking'}
