[project]
name = "reminder-agent-api"
version = "0.1.0"
description = "Natural-language reminder agent: one free-form request becomes one validated structured action"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "github-copilot-sdk==1.0.28",
    "tzdata==2026.6",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "pyyaml==6.0.3",
    "types-PyYAML==6.0.12.20261103",
    "jsonschema==4.26.0",
    "types-jsonschema==4.26.0.20261006",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../../tests/backend"]
pythonpath = [".", "../../.harness"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "covers(*ids): requirement ids (FR-, INV-, GR-, AC-) verified by the test",
    "endpoint(method, path, outcome): contract test for one operation, outcome is success or failure",
]

[tool.coverage.run]
source = ["app"]
branch = true
