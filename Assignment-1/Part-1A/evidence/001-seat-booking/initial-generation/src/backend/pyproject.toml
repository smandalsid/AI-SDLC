[project]
name = "bus-booking-api"
version = "0.1.0"
description = "Bus seat booking REST API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy>=2.0,<2.1",
    "pymssql",
    "alembic",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx2",
    "ruff",
    "mypy",
    "bandit",
    "pip-audit",
    "pyyaml",
    "types-PyYAML",
]

[tool.pytest.ini_options]
testpaths = ["../../tests/backend"]
pythonpath = ["."]
markers = ["perf: latency checks run serially with 1,000 stored bookings"]

[tool.coverage.run]
branch = true
source = ["app"]
